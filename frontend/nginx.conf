server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;
    root /usr/share/nginx/html;
    index index.html;

    # Controleer bij ieder bezoek of er een nieuwe frontendversie is.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite geeft gewijzigde assets een nieuwe bestandsnaam, dus deze mogen lang cachen.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router — stuur alles naar index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API-calls naar de backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
