# Dit bestand wordt automatisch samengevoegd bij `docker compose up` (alleen voor lokale ontwikkeling).
# Voeg dit NIET toe aan een productieserver.
services:

  db:
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    environment:
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS_ENABLE: "false"
      MAIL_STARTTLS_REQUIRED: "false"
      MAIL_FROM: Vlasje24 <accounts@vlasje24.local>
      MAIL_REPLY_TO: developer@vlasje24.local
      APP_BASE_URL: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "80:80"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vlasje24-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: vlasje24-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
