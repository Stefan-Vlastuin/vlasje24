services:

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: vlasje24-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_AUTH_TYPE: cookie
      PMA_ABSOLUTE_URI: https://pma.${DOMAIN}/
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: vlasje24-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - frontend
      - phpmyadmin

volumes:
  caddy_data:
  caddy_config:
